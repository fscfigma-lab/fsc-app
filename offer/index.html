<style>
:root{
  --paper:#fbf9f4; --milk:#f1ece1; --ink:#1b1b19; --ink-2:#33322d; --ink-3:#57554e;
  --warm:#8b857a; --line:#d7d0c3; --line-soft:#e6e0d4; --gold:#a8873f;
  --ui-bg:#f6f4ef; --ui-panel:#fff; --ui-line:#e2ddd2; --ui-ink:#232220; --ui-warm:#7d776c;
  --stage:#413f39;
  --display:"Cormorant Garamond",Georgia,serif;
  --text:"Manrope","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ui-bg);color:var(--ui-ink);font:400 13px/1.45 var(--text);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit}

/* ── шапка ─────────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;
  padding:10px 16px;background:var(--ui-panel);border-bottom:1px solid var(--ui-line);
}
.topbar .brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.topbar .brand b{font:600 14px/1 var(--text)}
.topbar .brand i{font:400 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ui-warm);font-style:normal}
.state{font:400 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ui-warm)}
.state.dirty{color:var(--gold)}
.btn{
  font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  padding:9px 12px;border:1px solid var(--ui-line);background:#fff;color:var(--ui-ink);
  border-radius:3px;cursor:pointer;transition:border-color .15s,color .15s;
}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn--go{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn--go:hover{background:#000;color:#fff;border-color:#000}
select.btn{text-transform:none;letter-spacing:0;font-family:var(--text);font-size:12px;padding:8px 10px}

.dwrap{position:relative}
.dwrap > .btn b{font-weight:600}
.panel{position:absolute;right:0;top:calc(100% + 8px);width:352px;max-height:62vh;overflow:auto;
  background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:4px;
  box-shadow:0 12px 32px rgba(0,0,0,.16);padding:8px;z-index:30}
.panel h4{margin:6px 8px 9px;font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ui-warm)}
.drow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px;border-radius:3px}
.drow + .drow{margin-top:2px}
.drow:hover{background:var(--ui-bg)}
.drow.cur{background:#faf6ec;box-shadow:inset 0 0 0 1px #ebdfc4}
.drow b{display:block;font:600 12.5px/1.3 var(--text)}
.drow span{display:block;margin-top:2px;font:400 11px/1.3 var(--text);color:var(--ui-warm)}
.drow .acts{display:flex;align-items:center;gap:4px}
.drow .here{font:500 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);padding:0 4px}
.panel footer{display:flex;gap:6px;padding:8px 8px 4px;margin-top:6px;border-top:1px solid var(--ui-line)}

/* ── раскладка ─────────────────────────────────────── */
.app{display:grid;grid-template-columns:minmax(340px,400px) 1fr;height:calc(100vh - 53px)}
@media (max-width:1100px){.app{grid-template-columns:1fr;height:auto}}

.editor{overflow-y:auto;background:var(--ui-panel);border-right:1px solid var(--ui-line);padding:6px 0 60px}
details.acc{border-bottom:1px solid var(--ui-line)}
details.acc > summary{
  display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;
  padding:12px 16px;font:600 12.5px/1 var(--text);
}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary::before{content:"+";font:400 13px/1 var(--mono);color:var(--gold);width:10px}
details.acc[open] > summary::before{content:"–"}
details.acc > summary .num{font:500 10px/1 var(--mono);color:var(--ui-warm);margin-left:auto}
.acc-body{padding:2px 16px 16px;display:flex;flex-direction:column;gap:11px}

.f{display:flex;flex-direction:column;gap:5px}
.f > label{font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ui-warm)}
.f input[type=text],.f input[type=date],.f textarea,.f select{
  width:100%;padding:8px 9px;border:1px solid var(--ui-line);border-radius:3px;
  background:#fdfcfa;color:var(--ui-ink);font-size:13px;line-height:1.4;
}
.f textarea{resize:vertical;min-height:62px}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(168,135,63,.12)}
.f .hint{font-size:11px;color:var(--ui-warm)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.vis{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ui-ink)}
.vis input{width:15px;height:15px;accent-color:var(--gold)}

.rep{border:1px solid var(--ui-line);border-radius:3px;padding:9px;display:flex;flex-direction:column;gap:7px;background:#fdfcfa}
.rep-head{display:flex;align-items:center;gap:5px}
.rep-head b{font:500 10px/1 var(--mono);letter-spacing:.1em;color:var(--ui-warm);margin-right:auto}
.mini{
  border:1px solid var(--ui-line);background:#fff;border-radius:3px;cursor:pointer;
  width:24px;height:24px;font:400 12px/1 var(--mono);color:var(--ui-ink);
}
.mini:hover{border-color:var(--gold);color:var(--gold)}
.mini--del:hover{border-color:#b3402f;color:#b3402f}
.add{align-self:flex-start;font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  padding:8px 11px;border:1px dashed var(--ui-line);background:transparent;border-radius:3px;cursor:pointer;color:var(--ui-warm)}
.add:hover{border-color:var(--gold);color:var(--gold)}

/* ── сцена предпросмотра ───────────────────────────── */
.stage{background:var(--stage);overflow:auto;padding:24px 0 60px;position:relative}
.stagebar{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
  margin:-24px 0 20px;padding:9px 18px;background:rgba(27,27,25,.9);backdrop-filter:blur(5px);
  border-bottom:1px solid #55524a;
}
.stagebar span{font:400 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#a9a49a}
.stagebar .warn{color:#e0a24a}
.stagebar .sp{margin-left:auto}
.stagebar #tip{color:#8d877c}
.zoom{background:transparent;border:1px solid #636057;color:#e8e4db;border-radius:3px;padding:6px 8px;font:400 11px/1 var(--mono);cursor:pointer}
.zoom[aria-pressed=true]{border-color:var(--gold);color:#e5c485}

.stack{display:flex;flex-direction:column;align-items:center;gap:18px;transform-origin:top center}

/* ── лист A4 ───────────────────────────────────────── */
.sheet{
  position:relative;width:210mm;height:297mm;background:var(--paper);color:var(--ink);
  overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.34);
  font:400 8.8pt/1.4 var(--text);
}
.sheet-in{position:absolute;inset:13mm 18mm 11mm 18mm;display:flex;flex-direction:column;gap:2.6mm}
.pfoot{position:absolute;left:18mm;right:18mm;bottom:6mm;display:flex;justify-content:space-between;
  font:400 6.5pt/1 var(--mono);letter-spacing:.12em;color:var(--warm)}

/* шапка оффера */
.oh{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:3mm;border-bottom:1px solid var(--line)}
.oh img{height:9mm;width:auto;display:block}
.oh .mk{text-align:right}
.oh .mk b{display:block;font:500 8pt/1 var(--mono);letter-spacing:.22em}
.oh .mk i{display:block;margin-top:1.8mm;font:400 6.5pt/1 var(--mono);letter-spacing:.14em;color:var(--warm);font-style:normal}
.u--head{display:flex;flex-direction:column;gap:2mm}
.u--head .hi{margin-top:1.6mm}
.u--head .role{margin-top:1.2mm}
.u--head .facts{margin-top:2.4mm}
.eyeb{margin:0;font:500 6.5pt/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.hi{margin:0;font:400 19pt/1.12 var(--display);letter-spacing:-.005em;text-wrap:balance;max-width:150mm}
.hi em{font-style:italic;color:var(--gold)}
.role{margin:0;font:500 8.5pt/1.35 var(--mono);letter-spacing:.04em}
.role small{display:block;margin-top:1.4mm;font:400 6.5pt/1.35 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--warm)}
.lead{margin:0;max-width:150mm;font-size:8.8pt;line-height:1.42;color:var(--ink-2)}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));background:var(--milk);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts > div{padding:3.2mm 4.5mm}
.facts > div + div{border-left:1px solid var(--line)}
.facts dt{font:400 6pt/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.facts dd{margin:2.6mm 0 0;font:500 11pt/1.05 var(--mono);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.facts dd span{display:block;margin-top:1.5mm;font:400 6.5pt/1.3 var(--text);letter-spacing:0;color:var(--warm)}

/* секции */
.sec{display:grid;grid-template-columns:11mm 1fr;column-gap:5mm;padding-top:2.8mm;border-top:1px solid var(--line-soft)}
.sec--cont{border-top:0;padding-top:0}
.sec > .idx{font:500 7pt/1 var(--mono);color:var(--gold);padding-top:.8mm;font-variant-numeric:tabular-nums}
.sec h2{margin:0 0 2.4mm;font:600 11.5pt/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.sec p{margin:0;max-width:150mm;font-size:8.8pt;line-height:1.42;color:var(--ink-2)}
.sec p + p{margin-top:2.2mm}
.grp + .grp{margin-top:2.8mm}
.grp h3{margin:0 0 1.8mm;font:600 8.5pt/1.25 var(--text)}
.grp h3 b{font:500 7pt/1 var(--mono);color:var(--gold);margin-right:2mm}
ul.it{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.4mm}
ul.it li{position:relative;padding-left:4mm;font-size:8.4pt;line-height:1.38;color:var(--ink-2);max-width:150mm}
ul.it li::before{content:"";position:absolute;left:0;top:1.7mm;width:1.8mm;height:1px;background:var(--gold)}

.route{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin:3mm 0 0;padding:0;list-style:none}
.route li{display:flex;align-items:center;gap:1.8mm;font:500 6.5pt/1 var(--mono);letter-spacing:.05em;white-space:nowrap}
.route li::before{content:"";width:1.3mm;height:1.3mm;border-radius:50%;background:var(--gold)}
.route li:not(:last-child)::after{content:"";width:100%;min-width:3mm;height:1px;background:var(--line);margin:0 1.8mm}

.terms{display:grid;grid-template-columns:1fr 1fr;column-gap:7mm;row-gap:3mm;margin:0;max-width:150mm}
.terms > div{display:flex;flex-direction:column;gap:1.2mm}
.terms dt{font:400 6pt/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--warm)}
.terms dd{margin:0;font-size:8.4pt;line-height:1.36}
.terms dd b{font-weight:600}

.tasks{display:flex;flex-direction:column;gap:2.4mm;counter-reset:t;margin:0}
.task{display:grid;grid-template-columns:7mm 1fr;column-gap:2.5mm;counter-increment:t}
.task::before{content:counter(t,decimal-leading-zero);font:500 7pt/1.35 var(--mono);color:var(--gold);font-variant-numeric:tabular-nums}
.task h4{margin:0 0 1mm;font:600 8.5pt/1.25 var(--text)}
.task p{margin:0;font-size:8.4pt;line-height:1.38;color:var(--ink-2);max-width:145mm}

.pay{display:grid;gap:4mm;margin:0}
.pay-card{background:var(--milk);border-top:2px solid var(--gold);padding:4.6mm 5mm 4.2mm;display:flex;flex-direction:column}
.pay-card .when{margin:0;font:400 6pt/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--warm)}
.pay-card .sum{margin:3mm 0 0;font:500 17pt/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pay-card .sum small{font-size:9pt;letter-spacing:.02em;color:var(--ink-3)}
.pay-card .unit{margin:2mm 0 0;font-size:7.5pt;line-height:1.35;color:var(--ink-3)}
.pay-card .plus{margin:3.4mm 0 0;padding-top:3mm;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:2.4mm}
.pay-card .plus i{font-style:normal;font:400 11pt/1 var(--mono);color:var(--gold)}
.pay-card .plus span{font:500 10.5pt/1.1 var(--mono);font-variant-numeric:tabular-nums}
.pay-card .plus em{font-style:normal;font:400 7pt/1.3 var(--text);color:var(--ink-3);margin-left:auto;text-align:right;max-width:48mm}
.pnote{margin:2.4mm 0 0;max-width:150mm;font-size:7pt;line-height:1.38;color:var(--warm)}

.sign{padding-top:4mm;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:9mm}
.sign .cap{margin:0;font:400 6pt/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--warm)}
.sign .from{margin:2.6mm 0 0;font-size:8.5pt;line-height:1.4}
.sign .from b{display:block;font:600 9pt/1.35 var(--text)}
.sign .accept{margin:2.6mm 0 0;font-size:8.5pt;line-height:1.4;max-width:74mm}
.rules{margin:5mm 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6mm}
.rule{display:flex;align-items:baseline;gap:2.4mm;font:400 7pt/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--warm)}
.rule s{flex:1;text-decoration:none;border-bottom:1px solid var(--ink);height:1px}

#gauge{position:fixed;left:-9999px;top:0;display:block;background:var(--paper);font:400 9pt/1.45 var(--text);color:var(--ink)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── печать: только листы ──────────────────────────── */
@page{size:A4 portrait;margin:0}
@media print{
  html,body{background:#fff}
  .topbar,.editor,.stagebar{display:none!important}
  .app{display:block;height:auto}
  .stage{background:#fff;overflow:visible;padding:0}
  .stack{display:block;transform:none!important}
  .sheet{box-shadow:none;margin:0;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

const DKEY="fsc_offer_drafts_v1", OLDKEY="fsc_offer_builder_v1";
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function newDraft(doc){
  const id=uid();
  DB.items[id]={doc:doc||clone(DEF),updatedAt:new Date().toISOString()};
  DB.current=id;return id;
}
function loadDB(){
  try{const r=localStorage.getItem(DKEY);if(r){const o=JSON.parse(r);
    if(o&&o.items&&Object.keys(o.items).length)return o;}}catch(e){}
  try{const r=localStorage.getItem(OLDKEY);if(r){const doc=JSON.parse(r);
    if(doc&&doc.v===1){const id=uid();
      return {current:id,items:{[id]:{doc,updatedAt:new Date().toISOString()}}};}}}catch(e){}
  return null;
}
let DB=loadDB();
if(!DB){DB={current:null,items:{}};newDraft();}
if(!DB.items[DB.current])DB.current=Object.keys(DB.items)[0];
let S=DB.items[DB.current].doc;

let saveT,renderT,quotaWarned=false;
function saveDB(){
  try{
    DB.items[DB.current]={doc:S,updatedAt:new Date().toISOString()};
    localStorage.setItem(DKEY,JSON.stringify(DB));
    const st=document.getElementById("state");st.textContent="Сохранено";st.classList.remove("dirty");
  }catch(e){
    document.getElementById("state").textContent="Не сохранилось";
    if(!quotaWarned){quotaWarned=true;
      alert("Браузер не даёт сохранить черновик — вероятно, кончилось место. Удалите ненужные черновики или выгрузите их в JSON.");}
  }
}
function touch(){
  const st=document.getElementById("state");
  st.textContent="Есть изменения";st.classList.add("dirty");
  clearTimeout(renderT);renderT=setTimeout(render,140);
  clearTimeout(saveT);saveT=setTimeout(()=>{saveDB();renderDrafts()},600);
}
function openDraft(id){
  if(!DB.items[id])return;
  saveDB();
  DB.current=id;S=DB.items[id].doc;
  buildEditor();render();renderDrafts();
}

/* ── пагинация по измеренной высоте ──────────────── */
function paginate(u){
  const g=document.getElementById("gauge");
  g.style.width=TEXTW+"mm";
  const GAP=2.6*MM;
  const hs=u.map(x=>{g.innerHTML=x.html;return g.firstElementChild.getBoundingClientRect().height;});
  g.innerHTML="";

  const chunks=[];let cur=null;
  u.forEach((x,i)=>{
    if(!cur)cur={html:"",h:0,n:0};
    cur.html+=x.html;cur.h+=hs[i]+(cur.n?GAP:0);cur.n++;
    if(!x.keep){chunks.push(cur);cur=null;}
  });
  if(cur)chunks.push(cur);

  const over=chunks.some(c=>c.h>USABLE);

  const fill=limit=>{
    const pages=[[]];let h=0;
    chunks.forEach(c=>{
      const cur=pages[pages.length-1];
      const add=(cur.length?GAP:0)+c.h;
      const cap=Math.min(USABLE,Math.max(limit,c.h));
      if(cur.length&&h+add>cap+1){pages.push([c]);h=c.h;}
      else{cur.push(c);h+=add;}
    });
    return pages;
  };

  let pages=fill(USABLE);
  if(pages.length>1){
    const total=chunks.reduce((a,c)=>a+c.h,0)+GAP*(chunks.length-pages.length);
    const bal=fill(total/pages.length);
    if(bal.length===pages.length)pages=bal;
  }
  return {pages,over};
}

function render(){
  const {pages,over}=paginate(units());
  document.getElementById("stack").innerHTML=pages.map((p,i)=>
    `<article class="sheet"><div class="sheet-in">${p.map(c=>c.html).join("")}</div>
     <div class="pfoot"><span>Five Stone Construction · Job Offer</span><span>Лист ${i+1} / ${pages.length}</span></div></article>`).join("");
  document.getElementById("pages").textContent=pages.length+(pages.length===1?" лист":pages.length<5?" листа":" листов");
  document.getElementById("warn").hidden=!over;
  fit();
}

/* ── масштаб ─────────────────────────────────────── */
let mode="fit";
function fit(){
  const stack=document.getElementById("stack"),stage=document.getElementById("stage");
  const w=210*MM, avail=stage.clientWidth-48;
  const k=mode==="fit"?Math.min(1,avail/w):1;
  stack.style.transform=`scale(${k})`;
  stack.style.marginBottom=(k<1?-(1-k)*stack.scrollHeight:0)+"px";
}
addEventListener("resize",fit);

/* ── события редактора ───────────────────────────── */
const ED=document.getElementById("editor");
ED.addEventListener("input",e=>{
  const t=e.target;if(!t.dataset.path)return;
  set(t.dataset.path,t.dataset.bool?t.checked:t.value);
  touch();
});
ED.addEventListener("change",e=>{
  if(e.target.dataset.bool){buildEditor();touch();}
});
ED.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.add){
    const list=get(b.dataset.add);
    const blank={facts:{l:"Новое условие",v:"",n:""},"duties.groups":{t:"Новая группа",items:"Пункт"},
      "terms.items":{l:"Поле",v:"Значение"},"probation.items":{t:"Задача",d:""},
      "pay.periods":{w:"Период",s:"0",u:"",p:"",pn:""}}[b.dataset.add];
    list.push(clone(blank));buildEditor();touch();
  }
  if(b.dataset.del){
    const [p,i]=b.dataset.del.split(":");const list=get(p);
    if(list.length<=1){alert("Последний элемент удалить нельзя — отключите раздел целиком.");return;}
    if(!confirm("Удалить элемент?"))return;
    list.splice(+i,1);buildEditor();touch();
  }
  if(b.dataset.move){
    const [p,i,d]=b.dataset.move.split(":");const list=get(p);const j=+i+ +d;
    if(j<0||j>=list.length)return;
    [list[+i],list[j]]=[list[j],list[+i]];buildEditor();touch();
  }
});

/* ── список черновиков ───────────────────────────── */
const dTitle=d=>(d.name||"").trim()||"Без имени";
function whenText(iso){
  const d=new Date(iso),n=new Date();
  const t=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  return d.toDateString()===n.toDateString()?`сегодня ${t}`
    :`${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")} ${t}`;
}
function renderDrafts(){
  const items=Object.entries(DB.items).sort((a,b)=>b[1].updatedAt.localeCompare(a[1].updatedAt));
  document.getElementById("dcount").textContent=items.length;
  document.getElementById("dpanel").innerHTML="<h4>Черновики офферов</h4>"+
    items.map(([id,it])=>`<div class="drow${id===DB.current?" cur":""}">
      <div><b>${esc(dTitle(it.doc))}</b><span>${esc(it.doc.role||"без должности")} · ${esc(whenText(it.updatedAt))}</span></div>
      <div class="acts">${id===DB.current?'<span class="here">открыт</span>'
        :`<button class="mini" type="button" data-open="${id}" title="Открыть">&rarr;</button>`}
        <button class="mini" type="button" data-dup="${id}" title="Дублировать">+</button>
        <button class="mini mini--del" type="button" data-drop="${id}" title="Удалить">&times;</button></div></div>`).join("")+
    '<footer><button class="add" type="button" data-fresh="1">+ новый оффер</button></footer>';
}
function togglePanel(open){
  const p=document.getElementById("dpanel"),b=document.getElementById("dbtn");
  const show=open!==undefined?open:p.hidden;
  p.hidden=!show;b.setAttribute("aria-expanded",String(show));
  if(show)renderDrafts();
}
document.getElementById("dbtn").onclick=e=>{e.stopPropagation();togglePanel()};
document.addEventListener("click",e=>{if(!e.target.closest(".dwrap"))togglePanel(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")togglePanel(false)});
document.getElementById("dpanel").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.open){openDraft(b.dataset.open);togglePanel(false);return;}
  if(b.dataset.fresh){saveDB();newDraft();S=DB.items[DB.current].doc;buildEditor();render();renderDrafts();togglePanel(false);return;}
  if(b.dataset.dup){
    const src=DB.items[b.dataset.dup];if(!src)return;
    const copy=clone(src.doc);copy.name=(copy.name||"Без имени")+" (копия)";
    const cur=DB.current;newDraft(copy);DB.current=cur;
    saveDB();renderDrafts();return;
  }
  if(b.dataset.drop){
    const id=b.dataset.drop,it=DB.items[id];if(!it)return;
    if(!confirm(`Удалить черновик «${dTitle(it.doc)}»? Отменить будет нельзя.`))return;
    delete DB.items[id];
    if(id===DB.current){
      const left=Object.entries(DB.items).sort((a,b)=>b[1].updatedAt.localeCompare(a[1].updatedAt));
      if(left.length){DB.current=left[0][0];S=DB.items[DB.current].doc;}
      else{newDraft();S=DB.items[DB.current].doc;}
      buildEditor();render();
    }
    saveDB();renderDrafts();
  }
});

/* ── шапка ───────────────────────────────────────── */
document.getElementById("pdf").onclick=()=>window.print();
document.getElementById("exp").onclick=()=>{
  const nm=(S.name||"offer").replace(/[^\wА-Яа-яЁё-]+/g,"_");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
  a.download=`FSC_Offer_${nm}_${S.date||""}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
document.getElementById("imp").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const o=JSON.parse(await f.text());
    if(o.v!==1)throw new Error("Другая версия файла");
    saveDB();newDraft(Object.assign(clone(DEF),o));S=DB.items[DB.current].doc;buildEditor();render();renderDrafts();
  }catch(err){alert("Не удалось прочитать файл: "+err.message)}
  e.target.value="";
};
document.getElementById("preset").onchange=e=>{
  const p=e.target.value;e.target.value="";
  if(!p)return;
  if(!confirm("Заменить содержание пресетом «"+p+"»? Текущий текст будет потерян."))return;
  S=Object.assign(clone(DEF),clone(PRESETS[p]||{}));buildEditor();touch();
};
document.getElementById("zfit").onclick=()=>{mode="fit";sync()};
document.getElementById("z100").onclick=()=>{mode="100";sync()};
function sync(){
  document.getElementById("zfit").setAttribute("aria-pressed",mode==="fit");
  document.getElementById("z100").setAttribute("aria-pressed",mode==="100");
  fit();
}

/* ── старт ───────────────────────────────────────── */
buildEditor();
renderDrafts();
(document.fonts?document.fonts.ready:Promise.resolve()).then(render);
render();
</script>
</body>
</html>
